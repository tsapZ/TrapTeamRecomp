# Codegen fixes for default.xex (Skylanders: Trap Team, Xbox 360).
# Keys use the same schema as the manifest's [entrypoint] table.
# Every entry (or group of same-reason entries) needs a comment: what's at the address, how it was
# found, and why the fix is safe. Addresses from the other Skylanders projects (SwapForceRecomp,
# SSARecomp, GiantsRecomp) apply to their own executables only and are checked against this one.
#
# Entries are added as codegen and the runtime report them.

# 0x821A3DA0 is in BinkOpen (Bink 2), right after it reads the 44-byte movie header into r1+112
# (li r6,44; addi r5,r1,112; bctrl) and just before the signature compares ("KB2f" and the later
# ones, lis r11,0x6632 / ori 0x424B). Found in the generated code by the same shape as GiantsRecomp's
# hook (there at r1+96). src/hooks/intro_skip_hook.cpp cuts the logo movies (skip_intro, on) and
# optionally the opening movie (skip_opening_movie, off) by setting their frame count to 1; other
# movies pass unchanged.
[[midasm_hook]]
address = 0x821A3DA0
name = "BinkHeaderLoaded"
registers = ["r1"]

# 0x821A5FE8 is the start of BinkClose (the Bink 2 SDK's, the same code in all four later games):
# found as the one Bink call in the game's movie close (sub_824A30F0), which clears the movie's
# handle right after it; that close is its only caller. With ultrawide active,
# src/hooks/ultrawide_hook.cpp turns the presenter's side bars it put up for the movie (at
# BinkOpen, see BinkHeaderLoaded) off again; it reads and changes no guest state.
[[midasm_hook]]
address = 0x821A5FE8
name = "BinkCloseHook"
registers = []

# The scene size hooks (src/hooks/scene_size_hook.cpp; experimental, off unless scene_size is
# set): the same render code as SwapForceRecomp's, found in a dump of this game's code by the
# instructions at its four hooks, each with the same instructions around it.
# 0x8243F650 is the start of the function that computes an igRenderTarget's size (r3): the
# only one reading its own _width / _height (+0x20 / +0x24) with the scales (+0x28 / +0x2C) nearby.
# The hook swaps in scene_size for a target that says 1040x620 (the 360 pipeline's mainScene).
[[midasm_hook]]
address = 0x8243F650
name = "SceneSizeHook"
registers = ["r3"]

# 0x824440A4 follows lis r5,0x20: r5 = 0x200000 is the frame's EDRAM planning heap (2048 tiles
# of 1024 bytes) for its init call; with the SDK's 4096-tile EDRAM it gets that many. r5 is only
# that argument.
[[midasm_hook]]
address = 0x824440A4
name = "EdramHeapSizeHook"
registers = ["r5"]

# 0x823EBDE0 is cmpwi cr6,r5,0x800: a render pass's EDRAM tiles against 2048, above which
# the game switches to predicated tiling (black scene in the SDK). r5 is lowered to 2048 when the
# pass fits into a 4096-tile EDRAM the SDK runs; r5 is not read on that path.
[[midasm_hook]]
address = 0x823EBDE0
name = "EdramTilingHook"
registers = ["r5"]

# 0x823ECAA0 follows subfic r9,r11,0x800 in the per-pass EDRAM allocation: r9 = 2048 minus
# the depth surface's tiles (r11), stored two instructions on. With a 4096-tile EDRAM the depth goes
# to its top instead; r9 is only read by that store.
[[midasm_hook]]
address = 0x823ECAA0
name = "EdramDepthBaseHook"
registers = ["r9", "r11"]

# 0x8230F784 and 0x8230F7F0 are the calls from the scene camera's per-frame set-up (twice a frame,
# with the same arguments) to the perspective builder sub_823B1AF0(r3 = projection matrix, f1 =
# horizontal FOV, f2 = vertical FOV, f3 = aspect, f4 = near, f5 = far; radians), as in
# SwapForceRecomp (hook UltrawideFovHook): the builder found by Swap Force's instructions, the call
# by a probe on all its callers (every frame, 16:9, the camera's FOV). src/hooks/ultrawide_hook.cpp
# widens f3 (and f1, keeping the vertical FOV) for a window wider than 16:9 with ultrawide_fov on;
# it only changes these calls' arguments.
[[midasm_hook]]
address = 0x8230F784
name = "UltrawideFovHook"
registers = ["f1", "f2", "f3"]

[[midasm_hook]]
address = 0x8230F7F0
name = "UltrawideFovHook"
registers = ["f1", "f2", "f3"]

# 0x821DD2D4 is stfs f31,188(r31) in sub_821DD170, the UI's screen set-up: it takes the display's
# size (+684 / +688 of the object at 0x8289436C), on a 16:9 video mode 1280 x 720 (the floats at
# 0x820EBA9C / 0x820EBAA0), and stores width and height at +188 / +192 of the UI screen object
# (the fields the UI scripts' "screen width" / "screen height" read, sub_821EF258 / sub_821EF2C8)
# and the aspect at 0x82826308. Found from the code loading those floats. With ultrawide_hud
# (on) on a wider window, src/hooks/ultrawide_hook.cpp sets f31 (the width) to the
# height x the window's aspect, as GiantsRecomp's hook does for its UI screen object (+180); it
# only changes this register. On by default (checked: HUD, dialogue box, notices, pause menu).
[[midasm_hook]]
address = 0x821DD2D4
name = "UltrawideHudHook"
registers = ["f29", "f31"]

[functions]
# Function starts the analyzer put one instruction late: it reached each function through a branch
# to its second instruction, while the real start is only in a pointer table (a vtable). Calling
# one ends the game with "Call to invalid or unregistered function at guest address ...", as
# SuperChargers and Imaginators did at boot (2026-10-21). Found in this game's code (a dump of
# guest memory with the input script's `save`): right after a `blr`, an instruction that is no
# known start, followed by one that is. Not reached yet in what was played; registered so they
# work when they are. A start that was in fact the second half of the function before only splits
# it, which the generated code handles as a tail call. No sizes given, the analyzer finds the ends.
0x821E2A2C = {}
0x821E2A6C = {}
0x8222918C = {}
0x823D8288 = {}
0x825E4DA0 = {}
0x8261749C = {}
0x82637D10 = {}
0x82657ED0 = {}
0x8266AC38 = {}
0x826885A0 = {}
0x826F3C88 = {}
0x827197FC = {}
0x827198DC = {}
0x827D065C = {}
